<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESTURIÓN PRODUCCIONES · Proyectos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:light;--bg:#f2f6fc;--panel:#fff;--fg:#162235;--muted:#65748a;--border:#d8e1ed;--input:#f8fbff;--head:#142239;--shadow:0 3px 18px #15263c12}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d141e;--panel:#182332;--fg:#f0f5fc;--muted:#aab9ca;--border:#34465b;--input:#111b29;--head:#090f18;--shadow:0 5px 22px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}header{background:var(--head);color:white;padding:18px max(16px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:19px;letter-spacing:.065em;margin:0}header small{color:#c5d1e0}.brand{display:flex;align-items:center;gap:15px;flex-wrap:wrap}main{max-width:1180px;margin:24px auto;padding:0 16px}.panel,.project{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:var(--shadow)}.project{border-left:5px solid #17b9e5}.project.locked{border-left-color:#778ba6}input,textarea,select,button{font:inherit;border-radius:9px;padding:10px}input,textarea,select{width:100%;background:var(--input);color:var(--fg);border:1px solid var(--border)}textarea{min-height:75px;resize:vertical}button{border:1px solid #2279e9;background:#2279e9;color:white;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:var(--fg);border-color:var(--border)}header button.secondary{color:white;border-color:#60748c}button.danger{background:transparent;color:#ff5b69;border-color:#ff5b69}button:disabled,input:disabled,textarea:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:145px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px;margin-top:14px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.meta{color:var(--muted);font-size:12px}.status{color:var(--muted);font-size:13px;margin:12px 0}.hidden{display:none!important}#login{max-width:420px;margin:8vh auto}.section-label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:19px}.project h3{font-size:19px;margin:0 0 5px}.project .row{margin-top:15px}.cycle{width:100%;border:0;min-height:44px;transition:filter .15s,transform .1s}.cycle:hover{filter:brightness(1.09)}.cycle:active{transform:scale(.98)}.phase-0,.category-0,.status-3{background:#9154ed;color:#fff}.phase-1,.category-2,.status-2{background:#16c1ec;color:#062b36}.phase-2,.category-1{background:#ff7137;color:white}.phase-3,.category-4,.status-0{background:#ffca32;color:#382b00}.phase-4,.category-3,.status-1,.yes{background:#29d576;color:#07371d}.category-5{background:#ed4e9b;color:#fff}.category-6{background:#778ba6;color:white}.category-7{background:#ef476f;color:white}.status-4,.no{background:#ff4d5e;color:white}.theme-toggle{background:#263c56;border-color:#6683a6;white-space:nowrap}.save-indicator{font-size:12px;color:var(--muted)}@media(max-width:600px){header{padding:16px}.brand{width:100%;justify-content:space-between}main{margin:14px auto}.panel,.project{padding:14px}h1{font-size:16px}.theme-toggle{font-size:12px;padding:8px}}
</style></head><body>
<header><div class="brand"><div><h1>ESTURIÓN PRODUCCIONES</h1><small>Gestión de proyectos audiovisuales</small></div><button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar modo claro u oscuro">🌙 Modo oscuro</button></div><div id="account" class="hidden"><span id="userEmail" class="meta" style="color:#d5e2f0"></span> <button id="logout" class="secondary">Cerrar sesión</button></div></header>
<main><section id="login" class="panel"><h2>Acceso privado</h2><p class="meta">Introduce tu correo y contraseña.</p><form id="loginForm"><p><label>Correo electrónico</label><input id="email" type="email" required autocomplete="username"></p><p><label>Contraseña</label><input id="password" type="password" required autocomplete="current-password"></p><button type="submit">Entrar</button></form><p id="loginMsg" class="status"></p></section>
<section id="app" class="hidden"><div class="panel"><div class="topline"><div><strong>Proyectos</strong><div class="meta">Guardado compartido en Supabase</div></div><button id="newBtn">+ Nuevo proyecto</button></div><div class="grid"><div><label>Buscar proyecto o cliente</label><input id="search" placeholder="Buscar…"></div><div><label>Filtrar por fase</label><select id="filterPhase"><option value="">Todas las fases</option></select></div><div><label>Filtrar por estado</label><select id="filterStatus"><option value="">Todos los estados</option></select></div><div><label>Filtrar por categoría</label><select id="filterCategory"><option value="">Todas las categorías</option></select></div><div><label>Agrupar por</label><select id="groupBy"><option value="">Sin agrupar</option><option value="cliente">Cliente</option><option value="categoria">Categoría</option></select></div></div></div>
<form id="newForm" class="panel hidden"><strong>Nuevo proyecto</strong><div class="grid"><div><label>Nombre *</label><input id="newName" required></div><div><label>Cliente</label><input id="newClient"></div><div><label>Categoría · pulsa para cambiar</label><button type="button" id="newCategory" class="cycle"></button></div><div><label>Fase · pulsa para cambiar</label><button type="button" id="newPhase" class="cycle"></button></div><div><label>Estado · pulsa para cambiar</label><button type="button" id="newStatus" class="cycle"></button></div><div><label>Fecha de rodaje</label><input id="newShootDate" type="date"></div><div><label>Fecha de entrega</label><input id="newDeliveryDate" type="date"></div><div><label>Presupuesto técnico (€)</label><input id="newBudget" type="number" min="0" step="0.01" value="0"></div></div><p><label>Descripción / notas</label><textarea id="newDescription"></textarea></p><div class="row"><button type="submit">Crear proyecto</button><button type="button" class="secondary" id="cancelNew">Cancelar</button></div><p id="newMsg" class="status"></p></form><p id="status" class="status"></p><div id="projects"></div></section></main>
<script>
'use strict';
const SUPABASE_URL='https://zaubqhnwixmvxcmbjivk.supabase.co',SUPABASE_PUBLISHABLE_KEY='sb_publishable_J2EKbs99McLIXH06hUVTCA_tzeovCpb';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id);
const phases=['Guion','Preproducción','Rodaje','Postproducción','Entrega'],statuses=['Pendiente','En curso','En revisión','Hecho','Bloqueado'],categories=['Corporativo','Publicidad','Evento','Documental','Ficción','Marketing','Otro','Entrevistas'];
let projects=[],channel=null,saveBusy=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('esturion-theme',t)}catch(e){}$('themeToggle').textContent=t==='dark'?'☀️ Modo claro':'🌙 Modo oscuro';}
let stored='light';try{stored=localStorage.getItem('esturion-theme')||'light'}catch(e){}theme(stored==='dark'?'dark':'light');$('themeToggle').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
function opts(id,values){$(id).insertAdjacentHTML('beforeend',values.map(v=>`<option>${esc(v)}</option>`).join(''));}opts('filterPhase',phases);opts('filterStatus',statuses);opts('filterCategory',categories);
function cycleHTML(field,value,values,kind,disabled){let i=values.indexOf(value);if(i<0)i=0;return `<button type="button" class="cycle ${kind}-${i}" data-cycle="${field}" title="Pulsa para cambiar" ${disabled?'disabled':''}>${esc(values[i])} ↻</button>`;}
function setupNewButton(id,values,kind,index){const b=$(id);b.dataset.index=index;b.dataset.kind=kind;b.textContent=values[index]+' ↻';b.className=`cycle ${kind}-${index}`;}
function initNew(){setupNewButton('newCategory',categories,'category',2);setupNewButton('newPhase',phases,'phase',0);setupNewButton('newStatus',statuses,'status',0);}initNew();
[['newCategory',categories,'category'],['newPhase',phases,'phase'],['newStatus',statuses,'status']].forEach(([id,values,kind])=>$(id).onclick=()=>setupNewButton(id,values,kind,(Number($(id).dataset.index)+1)%values.length));
function showApp(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('account').classList.remove('hidden');$('userEmail').textContent=user.email;loadProjects();subscribe();}
function showLogin(){$('app').classList.add('hidden');$('account').classList.add('hidden');$('login').classList.remove('hidden');}
async function loadProjects(){if(saveBusy)return;const {data,error}=await db.from('proyectos').select('*').order('created_at',{ascending:false});if(error){$('status').textContent='Error al cargar: '+error.message;return;}projects=data||[];render();}
function subscribe(){if(channel)return;channel=db.channel('proyectos-live').on('postgres_changes',{event:'*',schema:'public',table:'proyectos'},()=>loadProjects()).subscribe();}
function card(p){const dis=!!p.bloqueado,disabled=dis?'disabled':'';return `<article class="project ${dis?'locked':''}" data-id="${esc(p.id)}"><div class="topline"><div><h3>${esc(p.nombre)}</h3><div class="meta">${esc(p.cliente||'Sin cliente')}</div></div><button type="button" class="secondary lock">${dis?'🔒 Desbloquear':'🔓 Bloquear'}</button></div><div class="section-label">Producción</div><div class="grid"><div><label>Fase · pulsa para avanzar</label>${cycleHTML('fase',p.fase||'Guion',phases,'phase',dis)}</div><div><label>Categoría · pulsa para cambiar</label>${cycleHTML('categoria',p.categoria||'Evento',categories,'category',dis)}</div><div><label>Estado · pulsa para cambiar</label>${cycleHTML('estado',p.estado||'Pendiente',statuses,'status',dis)}</div></div><div class="section-label">Ficha del proyecto</div><div class="grid"><div><label>Nombre</label><input data-field="nombre" value="${esc(p.nombre)}" ${disabled}></div><div><label>Cliente</label><input data-field="cliente" value="${esc(p.cliente||'')}" ${disabled}></div><div><label>Fecha de rodaje</label><input data-field="fecha_rodaje" type="date" value="${esc(p.fecha_rodaje||'')}" ${disabled}></div><div><label>Fecha de entrega</label><input data-field="fecha_entrega" type="date" value="${esc(p.fecha_entrega||'')}" ${disabled}></div><div><label>Presupuesto técnico (€)</label><input data-field="presupuesto_tecnico" type="number" min="0" step="0.01" value="${Number(p.presupuesto_tecnico||0)}" ${disabled}></div><div><label>Presupuesto aceptado</label><button type="button" class="cycle ${p.presupuesto_aceptado?'yes':'no'}" data-bool="presupuesto_aceptado" ${disabled}>${p.presupuesto_aceptado?'SÍ ✓':'NO ✕'}</button></div><div><label>Presupuesto pagado</label><button type="button" class="cycle ${p.presupuesto_pagado?'yes':'no'}" data-bool="presupuesto_pagado" ${disabled}>${p.presupuesto_pagado?'SÍ ✓':'NO ✕'}</button></div></div><p><label>Descripción / notas</label><textarea data-field="descripcion" ${disabled}>${esc(p.descripcion||'')}</textarea></p><div class="row"><span class="save-indicator">${dis?'Proyecto bloqueado':'Editable · guardado al salir del campo'}</span><button type="button" class="danger delete" ${disabled}>Eliminar</button></div></article>`;}
function render(){const term=$('search').value.toLowerCase(),phase=$('filterPhase').value,status=$('filterStatus').value,cat=$('filterCategory').value,group=$('groupBy').value;const list=projects.filter(p=>(!term||(p.nombre+' '+(p.cliente||'')).toLowerCase().includes(term))&&(!phase||p.fase===phase)&&(!status||p.estado===status)&&(!cat||p.categoria===cat));$('status').textContent=list.length+' proyecto(s)';if(!group){$('projects').innerHTML=list.map(card).join('')||'<div class="panel">No hay proyectos que coincidan con el filtro.</div>';return;}const groups={};list.forEach(p=>{const key=(p[group]||'Sin '+group).trim();(groups[key]??=[]).push(p)});$('projects').innerHTML=Object.keys(groups).sort((a,b)=>a.localeCompare(b,'es')).map(k=>`<section><h3>${esc(k)} <span class="meta">(${groups[k].length})</span></h3>${groups[k].map(card).join('')}</section>`).join('')||'<div class="panel">No hay proyectos que coincidan con el filtro.</div>';}
async function updateField(id,field,value){if(saveBusy)return;saveBusy=true;const {error}=await db.from('proyectos').update({[field]:value,updated_at:new Date().toISOString()}).eq('id',id);saveBusy=false;if(error)alert('No se pudo guardar: '+error.message);await loadProjects();}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='Comprobando acceso…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent='No se pudo iniciar sesión: '+error.message;return;}showApp(data.user);});
$('logout').onclick=async()=>{await db.auth.signOut();if(channel){db.removeChannel(channel);channel=null;}showLogin();};$('newBtn').onclick=()=>$('newForm').classList.remove('hidden');$('cancelNew').onclick=()=>$('newForm').classList.add('hidden');
$('newForm').addEventListener('submit',async e=>{e.preventDefault();$('newMsg').textContent='Creando…';const row={nombre:$('newName').value.trim(),cliente:$('newClient').value.trim(),categoria:categories[Number($('newCategory').dataset.index)],fase:phases[Number($('newPhase').dataset.index)],estado:statuses[Number($('newStatus').dataset.index)],descripcion:$('newDescription').value.trim(),fecha_rodaje:$('newShootDate').value||null,fecha_entrega:$('newDeliveryDate').value||null,presupuesto_tecnico:Number($('newBudget').value||0),presupuesto_aceptado:false,presupuesto_pagado:false,bloqueado:false};const {error}=await db.from('proyectos').insert(row);if(error){$('newMsg').textContent='Error: '+error.message;return;}$('newForm').reset();initNew();$('newForm').classList.add('hidden');$('newMsg').textContent='';await loadProjects();});
$('projects').addEventListener('change',async e=>{const el=e.target.closest('input[data-field]');if(!el)return;const id=el.closest('[data-id]').dataset.id;const value=el.dataset.field==='presupuesto_tecnico'?Number(el.value||0):el.type==='date'?(el.value||null):el.value;await updateField(id,el.dataset.field,value);});
$('projects').addEventListener('focusout',async e=>{const el=e.target.closest('textarea[data-field]');if(!el)return;const id=el.closest('[data-id]').dataset.id;const original=projects.find(p=>p.id===id);if(original&&String(original.descripcion||'')!==el.value)await updateField(id,'descripcion',el.value);});
$('projects').addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;const wrapper=el.closest('[data-id]');if(!wrapper)return;const id=wrapper.dataset.id,p=projects.find(x=>x.id===id);if(!p)return;if(el.classList.contains('lock')){await updateField(id,'bloqueado',!p.bloqueado);return;}if(p.bloqueado)return;if(el.dataset.cycle){const field=el.dataset.cycle,values=field==='fase'?phases:field==='categoria'?categories:statuses;const next=values[(Math.max(0,values.indexOf(p[field]))+1)%values.length];await updateField(id,field,next);return;}if(el.dataset.bool){await updateField(id,el.dataset.bool,!p[el.dataset.bool]);return;}if(el.classList.contains('delete')&&confirm('¿Eliminar este proyecto? Esta acción no se puede deshacer.')){const {error}=await db.from('proyectos').delete().eq('id',id);if(error)alert(error.message);await loadProjects();}});
['search','filterPhase','filterStatus','filterCategory','groupBy'].forEach(id=>$(id).addEventListener('input',render));
db.auth.getSession().then(({data})=>{if(data.session)showApp(data.session.user);});db.auth.onAuthStateChange((_event,session)=>{if(session)showApp(session.user);else showLogin();});
</script></body></html>
