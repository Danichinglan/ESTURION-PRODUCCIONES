<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESTURIÓN PRODUCCIONES · Proyectos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20252b;background:#f3f5f7}
*{box-sizing:border-box}body{margin:0}header{background:#17232d;color:white;padding:22px max(18px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:20px;letter-spacing:.08em;margin:0}header small{color:#c6d0d8}main{max-width:1180px;margin:28px auto;padding:0 16px}
.panel,.project{background:white;border:1px solid #e1e6ea;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #17232d0a}
input,select,textarea,button{font:inherit;border:1px solid #ccd4db;border-radius:8px;padding:10px;background:white;color:#20252b}
button{cursor:pointer;background:#243746;color:white;border-color:#243746}button.secondary{background:white;color:#243746}button.danger{background:#fff;color:#a32929;border-color:#e6bcbc}
button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:145px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-top:14px}
label{display:block;font-size:12px;color:#687580;margin-bottom:5px}input,select,textarea{width:100%}textarea{min-height:68px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;margin-top:18px}.check input{width:auto}
.meta{font-size:12px;color:#687580}.status{font-size:13px;margin:10px 0;color:#53616c}.locked{background:#f8f9fa}
#login{max-width:420px;margin:8vh auto}#login h2{margin-top:0}.hidden{display:none!important}
.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#edf1f4;color:#43515c}
.project h3{margin:0;font-size:17px}.project .row{margin-top:12px}.section-label{font-size:13px;font-weight:650;color:#43515c;margin-top:16px}
@media(max-width:600px){header{padding:18px}main{margin:16px auto}.panel,.project{padding:14px}}
</style>
</head>
<body>
<header><div><h1>ESTURIÓN PRODUCCIONES</h1><small>Gestión de proyectos audiovisuales</small></div><div id="account" class="hidden"><span id="userEmail"></span> <button id="logout" class="secondary">Cerrar sesión</button></div></header>
<main>
<section id="login" class="panel">
<h2>Acceso privado</h2><p class="meta">Introduce tu correo y contraseña para acceder a los proyectos compartidos.</p>
<form id="loginForm"><div style="margin:12px 0"><label>Correo electrónico</label><input id="email" type="email" required autocomplete="username"></div><div style="margin:12px 0"><label>Contraseña</label><input id="password" type="password" required autocomplete="current-password"></div><button type="submit">Entrar</button></form><p id="loginMsg" class="status"></p>
</section>
<section id="app" class="hidden">
<div class="panel">
<div class="topline"><div><strong>Proyectos</strong><div class="meta">Los cambios se guardan en la base de datos y se comparten entre usuarios.</div></div><button id="newBtn">+ Nuevo proyecto</button></div>
<div class="grid">
<div><label>Buscar (proyecto, cliente o responsable)</label><input id="search" placeholder="Escribe para buscar…"></div>
<div><label>Filtrar por fase</label><select id="filterPhase"><option value="">Todas las fases</option><option>Guion</option><option>Preproducción</option><option>Rodaje</option><option>Postproducción</option><option>Entrega</option></select></div>
<div><label>Filtrar por estado</label><select id="filterStatus"><option value="">Todos los estados</option><option>Pendiente</option><option>En curso</option><option>En revisión</option><option>Hecho</option><option>Bloqueado</option></select></div>
<div><label>Filtrar por categoría</label><select id="filterCategory"><option value="">Todas las categorías</option><option>Corporativo</option><option>Publicidad</option><option>Evento</option><option>Documental</option><option>Ficción</option><option>Marketing</option><option>Otro</option></select></div>
<div><label>Agrupar proyectos por</label><select id="groupBy"><option value="">Sin agrupar</option><option value="cliente">Cliente</option><option value="responsable">Responsable</option><option value="categoria">Categoría</option></select></div>
</div></div>
<form id="newForm" class="panel hidden">
<strong>Nuevo proyecto</strong><div class="grid">
<div><label>Nombre del proyecto *</label><input id="newName" required></div>
<div><label>Cliente</label><input id="newClient"></div>
<div><label>Responsable</label><input id="newResponsible"></div>
<div><label>Categoría</label><select id="newCategory"><option>Corporativo</option><option>Publicidad</option><option selected>Evento</option><option>Documental</option><option>Ficción</option><option>Marketing</option><option>Otro</option></select></div>
<div><label>Fase de producción</label><select id="newPhase"><option>Guion</option><option>Preproducción</option><option>Rodaje</option><option>Postproducción</option><option>Entrega</option></select></div>
<div><label>Estado</label><select id="newStatus"><option>Pendiente</option><option>En curso</option><option>En revisión</option><option>Hecho</option><option>Bloqueado</option></select></div>
<div><label>Presupuesto técnico (€)</label><input id="newBudget" type="number" min="0" step="0.01" value="0"></div>
</div><div style="margin-top:12px"><label>Descripción / notas</label><textarea id="newDescription" placeholder="Detalles del encargo, observaciones…"></textarea></div>
<div class="row" style="margin-top:14px"><button type="submit">Crear proyecto</button><button type="button" id="cancelNew" class="secondary">Cancelar</button></div><p id="newMsg" class="status"></p>
</form>
<p id="status" class="status"></p><div id="projects"></div>
</section>
</main>
<script>
const SUPABASE_URL = "https://zaubqhnwixmvxcmbjivk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_J2EKbs99McLIXH06hUVTCA_tzeovCpb";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
let projects = [], channel = null;
const phases = ["Guion","Preproducción","Rodaje","Postproducción","Entrega"];
const statuses = ["Pendiente","En curso","En revisión","Hecho","Bloqueado"];
const categories = ["Corporativo","Publicidad","Evento","Documental","Ficción","Marketing","Otro"];
function esc(v){return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function options(values,current){return values.map(v=>`<option ${v===current?"selected":""}>${esc(v)}</option>`).join("");}
function showApp(user){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("account").classList.remove("hidden");$("userEmail").textContent=user.email;loadProjects();subscribe();}
function showLogin(){$("app").classList.add("hidden");$("account").classList.add("hidden");$("login").classList.remove("hidden");}
async function loadProjects(){const {data,error}=await db.from("proyectos").select("*").order("created_at",{ascending:false});if(error){$("status").textContent="Error al cargar proyectos: "+error.message;return;}projects=data||[];render();}
function subscribe(){if(channel)return;channel=db.channel("proyectos-live").on("postgres_changes",{event:"*",schema:"public",table:"proyectos"},()=>loadProjects()).subscribe();}
function cardMarkup(p){const dis=p.bloqueado?"disabled":"";return `<article class="project ${p.bloqueado?"locked":""}" data-id="${p.id}">
<div class="topline"><div><h3>${esc(p.nombre)}</h3><div class="meta">${esc(p.cliente||"Sin cliente")} · ${esc(p.categoria||"Sin categoría")} · ${esc(p.responsable||"Sin responsable")}</div><div style="margin-top:7px"><span class="pill">${esc(p.fase||"Guion")}</span> <span class="pill">${esc(p.estado||"Pendiente")}</span></div></div><button class="secondary lock" data-id="${p.id}">${p.bloqueado?"🔒 Desbloquear":"🔓 Bloquear"}</button></div>
<div class="section-label">Datos del proyecto</div><div class="grid">
<div><label>Nombre del proyecto</label><input data-field="nombre" value="${esc(p.nombre)}" ${dis}></div>
<div><label>Cliente</label><input data-field="cliente" value="${esc(p.cliente||"")}" ${dis}></div>
<div><label>Responsable</label><input data-field="responsable" value="${esc(p.responsable||"")}" ${dis}></div>
<div><label>Categoría</label><select data-field="categoria" ${dis}>${options(categories,p.categoria||"Evento")}</select></div>
<div><label>Fase de producción</label><select data-field="fase" ${dis}>${options(phases,p.fase||"Guion")}</select></div>
<div><label>Estado</label><select data-field="estado" ${dis}>${options(statuses,p.estado||"Pendiente")}</select></div>
<div><label>Presupuesto técnico (€)</label><input data-field="presupuesto_tecnico" type="number" min="0" step="0.01" value="${Number(p.presupuesto_tecnico||0)}" ${dis}></div>
<div class="check"><input data-field="presupuesto_aceptado" type="checkbox" ${p.presupuesto_aceptado?"checked":""} ${dis}><label>Presupuesto aceptado</label></div>
<div class="check"><input data-field="presupuesto_pagado" type="checkbox" ${p.presupuesto_pagado?"checked":""} ${dis}><label>Presupuesto pagado</label></div>
</div><div style="margin-top:12px"><label>Descripción / notas</label><textarea data-field="descripcion" ${dis}>${esc(p.descripcion||"")}</textarea></div>
<div class="row"><span class="meta">${p.bloqueado?"Proyecto bloqueado":"Proyecto editable"} · Guardado automático al cambiar un campo</span><button class="danger delete" data-id="${p.id}" ${dis}>Eliminar</button></div></article>`;}
function render(){
 const term=$("search").value.toLowerCase(), phase=$("filterPhase").value, status=$("filterStatus").value, cat=$("filterCategory").value, group=$("groupBy").value;
 const list=projects.filter(p=>(!term||(p.nombre+" "+(p.cliente||"")+" "+(p.responsable||"")).toLowerCase().includes(term))&&(!phase||p.fase===phase)&&(!status||p.estado===status)&&(!cat||p.categoria===cat));
 $("status").textContent=list.length+" proyecto(s)";
 if(!group){$("projects").innerHTML=list.map(cardMarkup).join("")||'<div class="panel">No hay proyectos que coincidan con el filtro.</div>';return;}
 const groups={};list.forEach(p=>{const key=(p[group]||"Sin "+group).trim();(groups[key]??=[]).push(p);});
 $("projects").innerHTML=Object.keys(groups).sort((a,b)=>a.localeCompare(b,"es")).map(k=>`<section><h3 style="font-size:15px;margin:18px 2px 10px">${esc(k)} <span class="meta">(${groups[k].length})</span></h3>${groups[k].map(cardMarkup).join("")}</section>`).join("")||'<div class="panel">No hay proyectos que coincidan con el filtro.</div>';
}
async function updateField(id,field,value){const {error}=await db.from("proyectos").update({[field]:value,updated_at:new Date().toISOString()}).eq("id",id);if(error){alert("No se pudo guardar: "+error.message);return;}await loadProjects();}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginMsg").textContent="Comprobando acceso…";const {data,error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("loginMsg").textContent="No se pudo iniciar sesión: "+error.message;return;}showApp(data.user);});
$("logout").onclick=async()=>{await db.auth.signOut();if(channel){db.removeChannel(channel);channel=null;}showLogin();};
$("newBtn").onclick=()=>$("newForm").classList.remove("hidden");
$("cancelNew").onclick=()=>$("newForm").classList.add("hidden");
$("newForm").addEventListener("submit",async e=>{e.preventDefault();$("newMsg").textContent="Creando…";const row={nombre:$("newName").value.trim(),cliente:$("newClient").value.trim(),responsable:$("newResponsible").value.trim(),categoria:$("newCategory").value,fase:$("newPhase").value,estado:$("newStatus").value,descripcion:$("newDescription").value.trim(),presupuesto_tecnico:Number($("newBudget").value||0),presupuesto_aceptado:false,presupuesto_pagado:false,bloqueado:false};const {error}=await db.from("proyectos").insert(row);if(error){$("newMsg").textContent="Error: "+error.message;return;}$("newForm").reset();$("newForm").classList.add("hidden");$("newMsg").textContent="";await loadProjects();});
$("projects").addEventListener("change",async e=>{const el=e.target.closest("[data-field]");if(!el)return;const card=el.closest("[data-id]");let value=el.type==="checkbox"?el.checked:el.value;if(el.dataset.field==="presupuesto_tecnico")value=Number(value||0);await updateField(card.dataset.id,el.dataset.field,value);});
$("projects").addEventListener("focusout",async e=>{const el=e.target.closest("textarea[data-field]");if(!el)return;const card=el.closest("[data-id]");await updateField(card.dataset.id,el.dataset.field,el.value);});
$("projects").addEventListener("click",async e=>{const lock=e.target.closest(".lock");if(lock){const p=projects.find(x=>x.id===lock.dataset.id);await updateField(p.id,"bloqueado",!p.bloqueado);return;}const del=e.target.closest(".delete");if(del&&confirm("¿Eliminar este proyecto? Esta acción no se puede deshacer.")){const {error}=await db.from("proyectos").delete().eq("id",del.dataset.id);if(error)alert(error.message);await loadProjects();}});
["search","filterPhase","filterStatus","filterCategory","groupBy"].forEach(id=>$(id).addEventListener("input",render));
db.auth.getSession().then(({data})=>{if(data.session)showApp(data.session.user);});
db.auth.onAuthStateChange((_event,session)=>{if(session)showApp(session.user);else showLogin();});
</script>
</body>
</html>
